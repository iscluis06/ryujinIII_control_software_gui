name: Build and test project

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libgif7 libgif-dev cmake pkgconf-bin pkgconf libgtkmm-4.0-0 libgtkmm-4.0-dev build-essential git curl libusb-1.0-0 libusb-1.0-0-dev libargs-dev googletest google-mock libgmock-dev libgtest-dev

      - name: Build project
        run: |
          mkdir build
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build
          cmake --build build

      - name: Test project
        run: |
          cd build
          tests/ryujinIII_gtest --gtest_filter=* --gtest_color=no
